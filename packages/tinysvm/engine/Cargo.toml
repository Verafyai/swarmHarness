# The TinySVM engine: LiteSVM, restricted to the TinySVM programs, run as a
# sidecar process that speaks JSON lines over stdio. See ../README.md.
[package]
name = "tinysvm-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "tinysvm"
path = "src/main.rs"

# Exact pins. litesvm 0.18.2 is the release of 2026-11-04 on crates.io; the
# solana-* versions are the ones litesvm 0.18.2 resolves to (Agave 4.3.2 line).
# Cargo.lock is committed, so every transitive version is pinned too.
[dependencies]
litesvm = "=0.18.2"
solana-account = "=4.7.0"
solana-address = "=2.7.0"
solana-instruction = "=3.5.1"
solana-keypair = "=3.1.2"
solana-message = "=4.6.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"
solana-compute-budget = "=4.3.2"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hex = "=0.4.3"

[workspace]

[profile.release]
codegen-units = 16
